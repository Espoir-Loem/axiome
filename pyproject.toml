[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiome"
version = "0.1.0"
description = "IA neuro-symbolique déterministe, frugale et vérifiable — construite de zéro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Projet Axiome" }]
# Le noyau (M0/M1) n'a AUCUNE dépendance. NumPy n'arrivera qu'avec le module neural (M2, ADR-0003).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7.1.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
axiome = "axiome.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiome = ["data/seed/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["axiome"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C90", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004", "PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["axiome"]
